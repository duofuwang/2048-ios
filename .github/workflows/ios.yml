name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run core tests
        run: swift test --package-path Core

      - name: Boot simulator
        run: xcrun simctl boot "iPhone 16" || true

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      - name: Build and run UI tests
        working-directory: App
        run: |
          xcodebuild test -project Game2048.xcodeproj -scheme Game2048 \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO

      - name: Launch and screenshot
        run: |
          xcrun simctl bootstatus "iPhone 16" -b
          APP=App/build/Build/Products/Debug-iphonesimulator/Game2048.app
          xcrun simctl install "iPhone 16" "$APP"
          set +e
          xcrun simctl launch "iPhone 16" com.duofuwang.game2048
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "launch failed with $STATUS"
            echo "=== app contents ==="
            ls -la "$APP"
            echo "=== Info.plist ==="
            plutil -p "$APP/Info.plist"
            echo "=== codesign ==="
            codesign -dv "$APP" 2>&1 | head -20
            echo "=== crash reports ==="
            ls -lt ~/Library/Logs/DiagnosticReports | head -10 || true
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
              echo "--- $f"
              head -80 "$f"
            done
            echo "=== simulator log ==="
            xcrun simctl spawn "iPhone 16" log show --last 2m --style compact \
              --predicate 'eventMessage CONTAINS[c] "Game2048"' | tail -60 || true
            exit $STATUS
          fi
          sleep 3
          mkdir -p artifacts
          xcrun simctl io "iPhone 16" screenshot artifacts/launch.png
          xcrun simctl terminate "iPhone 16" com.duofuwang.game2048 || true
          xcrun simctl launch "iPhone 16" com.duofuwang.game2048 -showGame -seedBoard
          sleep 3
          xcrun simctl io "iPhone 16" screenshot artifacts/game.png
          xcrun simctl terminate "iPhone 16" com.duofuwang.game2048 || true
          xcrun simctl launch "iPhone 16" com.duofuwang.game2048 -showGame -showGameOver
          sleep 3
          xcrun simctl io "iPhone 16" screenshot artifacts/gameover.png
          xcrun simctl terminate "iPhone 16" com.duofuwang.game2048 || true
          xcrun simctl launch "iPhone 16" com.duofuwang.game2048 -showGame -showNewGame
          sleep 3
          xcrun simctl io "iPhone 16" screenshot artifacts/newgame.png
          xcrun simctl terminate "iPhone 16" com.duofuwang.game2048 || true
          xcrun simctl launch "iPhone 16" com.duofuwang.game2048 -showGame -seedBoard -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN
          sleep 3
          xcrun simctl io "iPhone 16" screenshot artifacts/game-zh.png
          xcrun simctl terminate "iPhone 16" com.duofuwang.game2048 || true
          xcrun simctl launch "iPhone 16" com.duofuwang.game2048 -showGame -seedBoard -AppleLanguages '(de)' -AppleLocale de_DE
          sleep 3
          xcrun simctl io "iPhone 16" screenshot artifacts/game-de.png
          for screen in showSettings:settings showTutorial:tutorial showAbout:about; do
            flag=${screen%%:*}
            name=${screen##*:}
            xcrun simctl terminate "iPhone 16" com.duofuwang.game2048 || true
            xcrun simctl launch "iPhone 16" com.duofuwang.game2048 "-$flag"
            sleep 3
            xcrun simctl io "iPhone 16" screenshot "artifacts/$name.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshot
          path: artifacts
