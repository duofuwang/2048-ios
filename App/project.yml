name: Game2048
options:
  bundleIdPrefix: com.duofuwang
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_DEBUG_DYLIB: NO
targets:
  Game2048:
    type: application
    platform: iOS
    sources:
      - path: Game2048
    dependencies:
      - package: Game2048Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duofuwang.game2048
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Game2048/Info.plist
      properties:
        CFBundleDisplayName: "2048"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIDeviceFamily:
          - 1
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  Game2048UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Game2048UITests
    dependencies:
      - target: Game2048
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duofuwang.game2048UITests
        TEST_TARGET_NAME: Game2048
        GENERATE_INFOPLIST_FILE: YES
packages:
  Game2048Core:
    path: ../Core
schemes:
  Game2048:
    build:
      targets:
        Game2048: all
        Game2048UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: Game2048UITests
